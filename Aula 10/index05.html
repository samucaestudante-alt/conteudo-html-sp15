<!DOCTYPE html>
<html>
    <head>
        <title>Conteúdo Aula10 - HTML</title>
    </head>
    <body>

        <h1>Definindo Listas no HTML</h1>

        <h3>Exemplo de Lista Não Ordenada</h3>

        <ul>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
        </ul>

        <hr>

        <h3>Exemplo de Lista Ordenada</h3>

        <ol>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
        </ol>
    </body>
</html>
