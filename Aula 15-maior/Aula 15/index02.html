<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula15 - HTML</title>
    </head>
    <body>

        <h1>Caminhos de Arquivos no HTML</h1>

        <h3>Arquivos no HTML</h3>

        <img src="rock.jpg" width="250" height="140">

        <hr>

        <h3>Arquivo em uma pasta de mesmo nível que o HTML</h3>

        <img src="img/rock.jpg" width="250" height="140">

        <hr>

        <h3>Arquivo em uma pasta na raíz da estrutura</h3>

        <img src="/Aula15-img/rock.jpg" width="250" height="140">

        <hr>

        <h3>Arquivo em nível maior que o HTML</h3>

        <img src="../rock.jpg" width="250" height="140">
    </body>
</html>
