<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula16 - HTML</title>

    <style>

        * {
            box-sizing: border-box;
        }

        .esq {
            background-color: darkmagenta;
            padding: 20px;
            width: 20%;
            float: left;
        }

        .meio {
            background-color: crimson;
            padding: 20px;
            width: 60%;
            float: left;
        }

        .dir {
            background-color: darkorange;
            padding: 20px;
            width: 20%;
            float: left;
        }

        @media screen and (max-width: 800px) {
            .esq, .meio, .dir {
                width: 100%;
            }
        }

    </style>
</head>
<body>
    
    <h1>Responsividade no HTML</h1>

    <h3>Imagem responsiva com width: 100%;</h3>

    <img src="rock.jpg" style="width:100%;">

    <hr>

    <h3>Imagem responsiva com o max-width: 100%;</h3>

    <img src="rock.jpg" style="max-width:100%;">

    <hr>

    <h3 style="font-size: 5vw;">Texto responviso com a unidade de medida vw</h3>

    <p style="font-size: 3vw;">Somente a dor coletiva gera união</p>

    <hr>

    <h3>Responsividade com media query</h3>

    <div class="esq">
        <p>Div Esquerda</p>
    </div>
    
    <div class="meio">
        <p>Div Centro</p>
    </div>

    <div class="dir">
        <p>Div Direita</p>
    </div>

</body>
</html>
